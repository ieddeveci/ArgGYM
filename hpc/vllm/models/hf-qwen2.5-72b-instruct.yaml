dtype: bfloat16

# Native checkpoint config is 32,768. The card's 131,072 needs static YaRN,
# which it advises adding only for long inputs; ArgGYM's are short.
max_model_len: 32768
gpu_memory_utilization: 0.9
trust_remote_code: false
extra_args: []

tensor_parallel_size_h100: 4
tensor_parallel_size_h200: 2

name: gemma-4-31b-it
hf_id: google/gemma-4-31B-it
model_path: google/gemma-4-31B-it
image: vllm/vllm-openai:latest
# 59G of weights on an 80GB card leaves the least KV headroom in the roster:
# only ~60k KV tokens, so at the roster's 40960 max_model_len each replica holds
# just 1.47 concurrent requests. Firing 96 concurrent oversubscribed it ~16x and
# thrashed the KV cache until a replica OOM'd. The fix is below (max_model_len +
# matched concurrency); util stays at 0.92 -- lowering it to 0.90 only shrank KV
# further and made the crash happen sooner.
gpu_memory_utilization: 0.92
# gemma reasons concisely: across 190 real samples, completion tokens were
# mean 3843, p99 7459, max 8029. Capping the sequence at 20480 (~19k output
# after the ~1k prompt) is more than 2x its observed max -- no truncation -- and
# nearly triples KV concurrency (1.47x -> 2.9x per replica).
max_model_len: 20480
# Output cap must fit max_model_len (above). gemma's max observed output is 8029
# tokens over 339 samples, so 16384 truncates nothing while leaving prompt room.
max_tokens: 16384
# Gemma-4's template only injects a thinking turn when enable_thinking is
# explicitly true, so without this the model would be evaluated with thinking
# OFF while every Qwen in the roster had it ON.
reasoning_parser: gemma4
enable_thinking: true
# Gemma-4 is multimodal: vLLM reserves a per-image token budget (2496) that
# exceeds the default max_num_batched_tokens (2048) and refuses to start. Raise
# it just past the floor (4096, not 8192) -- the first attempt's server died
# mid-run, and the larger prefill batch inflating activation memory on the
# tightest-fitting model in the roster is the leading suspect.
# --max-num-seqs 5 is the real fix for the repeated crashes: gemma's KV pool
# holds ~44k tokens/replica, and at gemma's 8k max output that is only ~5.5
# sequences. Without this cap the scheduler admitted as many running sequences
# as the client sent (concurrency 24), they grew past the pool, and vLLM raised
# a fatal "Cannot get free blocks from the pool" instead of preempting. Capping
# admitted running sequences at 5/replica keeps the pool from ever exhausting.
extra_args: ["--max-num-batched-tokens", "4096", "--max-num-seqs", "5"]
sampling:
  temperature: 1.0
  top_p: 0.95
  top_k: 64
sampling_source: own generation_config.json

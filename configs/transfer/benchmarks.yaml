  bbh:
    display_name: BIG-Bench Hard
    implementation: lm_eval
    repository: SaylorTwift/bbh
    dataset_revision: b5306be6f827cfafbb545ff5a51f96916029b0fd
    harness_revision: d6de81643928d653435c431bae19945d41d32520

    harness_task: bbh
    resolved_variant: bbh_cot_fewshot
    tasks: all_23
    use_pinned_task_defaults: true
    generation_override: qwen3_thinking_sampling_v1
    report_breakdowns:

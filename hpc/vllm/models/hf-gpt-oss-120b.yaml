endpoint_config: hf-gpt-oss-120b
hf_model: openai/gpt-oss-120b
params_b: 5.1
active_params_b: 5.1
tier: xlarge-moe

# Official checkpoint uses MXFP4 quantization for the MoE expert weights.
# bfloat16 is the vLLM compute/unquantized-tensor dtype used by this ArgGYM lane.
dtype: bfloat16
quantization: mxfp4

tensor_parallel_size: 1
max_model_len: 65536
gpu_memory_utilization: 0.9
reasoning_parser: openai_gptoss
trust_remote_code: false

extra_args:
- --no-enable-prefix-caching
- --max-num-batched-tokens
- '8192'

# A single 80 GB H100 is supported by OpenAI/vLLM, but two H100s are the
# conservative ArgGYM choice. One 141 GB H200 has ample headroom.
tensor_parallel_size_h100: 2
tensor_parallel_size_h200: 1

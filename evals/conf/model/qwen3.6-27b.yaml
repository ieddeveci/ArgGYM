name: qwen3.6-27b
hf_id: Qwen/Qwen3.6-27B
# Cached flat (config.json + 15 shards at the top of the cache dir, no
# snapshots/ tree), so the repo id would trigger a 52G re-download.
# Must be served by absolute path inside the container.
model_path: /root/.cache/huggingface/hub/models--Qwen--Qwen3.6-27B
image: vllm/vllm-openai:latest
reasoning_parser: qwen3
# Qwen3.x templates think unless explicitly disabled; sent explicitly anyway.
enable_thinking: true
# 0.85 left only ~16GB for KV after 52GB of weights, capping concurrency at
# 12-14 of 32 in-flight requests with the cache pegged at 98%. vLLM also warns
# CUDA-graph profiling makes 0.85 effectively 0.8373.
gpu_memory_utilization: 0.93
extra_args: []
sampling:
  temperature: 1.0
  top_p: 0.95
  top_k: 20
sampling_source: own generation_config.json

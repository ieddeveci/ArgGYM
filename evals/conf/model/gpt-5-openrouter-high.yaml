# GPT-5 through OpenRouter, which speaks the OpenAI protocol fully and returns
# reasoning in `reasoning`.
#
# Limits: OpenRouter's models API lists context 400000, max_completion_tokens
# 128000 and max_prompt_tokens 272000 for openai/gpt-5
# (https://openrouter.ai/api/v1/models). The cap is the output limit.
#
# No temperature: OpenRouter does not list `temperature` or `top_p` among the
# parameters this model supports, and OpenAI's guidance is to omit them for its
# reasoning models (https://developers.openai.com/api/docs/guides/latest-model).
#
# Reasoning effort: high. gpt-5 supports "minimal, low, medium, and high"
# (https://developers.openai.com/api/docs/models/gpt-5).
# OpenRouter passes the effort through to OpenAI and describes it as a share
# of max_tokens spent on reasoning, about 10 / 20 / 50 / 80% for minimal / low /
# medium / high (https://openrouter.ai/docs/use-cases/reasoning-tokens).
# One config per level: gpt-5-openrouter-minimal, gpt-5-openrouter-low,
# gpt-5-openrouter-medium, gpt-5-openrouter-high.
name: gpt-5-openrouter-high
model: openai/gpt-5
base_url: https://openrouter.ai/api/v1
api_key_env: OPENROUTER_API_KEY
sampling:
  max_tokens: 128000
extra_body:
  reasoning:
    effort: high

# meta-llama/Llama-3.2-3B-Instruct on vLLM, served by
# hpc/vllm/models/hf-llama-3.2-3b-instruct.yaml.
#
# Sampling: the card gives none, so this is generation_config.json: temperature
# 0.6, top_p 0.9. The meta-llama repo is gated to us; the file was read from
# the ungated copy https://huggingface.co/unsloth/Llama-3.2-3B-Instruct.
#
# Cap: 65,536, one output cap across the roster so every model gets the same
# token budget. 65,536 is the Gemini API's output limit, thinking included, so
# no larger cap can hold across the roster. The card recommends no output
# length. The cap fits within the serving profile's max_model_len minus the
# 8,192-token prompt reserve (hpc/vllm/verify_bundle.py checks both).
# Longest prompt in tasksets/standard.yaml with this tokenizer: 4,088
# tokens (tokenizer from unsloth/Llama-3.2-3B-Instruct; the original is gated).
name: hf-llama-3.2-3b-instruct
model: meta-llama/Llama-3.2-3B-Instruct
base_url: ${oc.env:VLLM_BASE_URL,http://127.0.0.1:8000/v1}
api_key_env: VLLM_API_KEY
sampling:
  max_tokens: 65536
  temperature: 0.6
  top_p: 0.9
  seed: 0

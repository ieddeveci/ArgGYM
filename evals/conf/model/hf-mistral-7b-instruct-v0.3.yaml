# mistralai/Mistral-7B-Instruct-v0.3 on vLLM, served by
# hpc/vllm/models/hf-mistral-7b-instruct-v0.3.yaml.
#
# Sampling: the card gives none and generation_config.json sets no sampling
# keys (https://huggingface.co/mistralai/Mistral-7B-Instruct-v0.3), so the
# values are left as they were, without a source.
#
# Cap: 24,576, the serving profile's max_model_len minus the 8,192-token prompt
# reserve. The roster shares one output cap, 65,536, so every model gets the
# same token budget (65,536 is the Gemini API's output limit, thinking included,
# so no larger cap can hold across the roster); this profile's context leaves
# less, so the cap is what it leaves (hpc/vllm/verify_bundle.py checks both).
# The card recommends no output length.
# Longest prompt in tasksets/standard.yaml with this tokenizer: 4,773
# tokens.
name: hf-mistral-7b-instruct-v0.3
model: mistralai/Mistral-7B-Instruct-v0.3
base_url: ${oc.env:VLLM_BASE_URL,http://127.0.0.1:8000/v1}
api_key_env: VLLM_API_KEY
sampling:
  max_tokens: 24576
  temperature: 0.7
  top_p: 0.95
  seed: 0

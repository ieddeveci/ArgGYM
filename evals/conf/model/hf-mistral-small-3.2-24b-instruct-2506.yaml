# mistralai/Mistral-Small-3.2-24B-Instruct-2506 on vLLM, served by
# hpc/vllm/models/hf-mistral-small-3.2-24b-instruct-2506.yaml.
#
# Sampling: the card's "We recommend using a relatively low temperature, such as
# temperature=0.15"; generation_config.json agrees and sets no top_p
# (https://huggingface.co/mistralai/Mistral-Small-3.2-24B-Instruct-2506).
#
# The card also asks for a system prompt (its SYSTEM_PROMPT.txt for general
# use); the harness sends only the elicitation's (a prompt-layer choice, not
# changed here).
#
# Cap: 65,536. Every config caps its output at 65,536 tokens at most, less where
# its context or provider limit is smaller, so token budgets match wherever the
# limits allow. 65,536 is the Gemini API's output limit, thinking included, so
# no larger cap can hold across the roster. The card recommends no output length
# (its vLLM examples set MAX_TOK = 131072, the whole context). The cap fits
# within the serving profile's max_model_len minus the 8,192-token prompt
# reserve (hpc/vllm/verify_bundle.py checks both).
# Longest prompt in data/taskset.yaml with this tokenizer: 4,163
# tokens.
name: hf-mistral-small-3.2-24b-instruct-2506
model: mistralai/Mistral-Small-3.2-24B-Instruct-2506
base_url: ${oc.env:VLLM_BASE_URL,http://127.0.0.1:8000/v1}
api_key_env: VLLM_API_KEY
sampling:
  max_tokens: 65536
  temperature: 0.15
  seed: 0

# Qwen/Qwen3.6-27B on vLLM, served by hpc/vllm/models/hf-qwen3.6-27b.yaml.
#
# Sampling: the card's "Thinking mode for general tasks": temperature=1.0,
# top_p=0.95, top_k=20, min_p=0.0, presence_penalty=0.0, repetition_penalty=1.0
# (https://huggingface.co/Qwen/Qwen3.6-27B).
#
# presence_penalty is 0.0 because this card says so. The 1.5 this config
# used to carry is the Qwen3.6-35B-A3B card's value, not this one's (#130).
#
# Cap: the longest output the card recommends, 81,920:
# "We recommend using an output length of 32,768 tokens for most queries.
# For benchmarking on highly complex problems, such as those found in math and
# programming competitions, we suggest setting the max output length to
# 81,920 tokens." (https://huggingface.co/Qwen/Qwen3.6-27B).
# It fits within the serving profile's max_model_len minus the 8,192-token prompt
# reserve (hpc/vllm/verify_bundle.py checks the cap fits).
# Longest prompt in tasksets/standard.yaml with this tokenizer: 4,390
# tokens.
name: hf-qwen3.6-27b
model: Qwen/Qwen3.6-27B
base_url: ${oc.env:VLLM_BASE_URL,http://127.0.0.1:8000/v1}
api_key_env: VLLM_API_KEY
sampling:
  max_tokens: 81920
  temperature: 1.0
  top_p: 0.95
  presence_penalty: 0.0
  seed: 0
extra_body:
  top_k: 20
  min_p: 0.0
  repetition_penalty: 1.0
  chat_template_kwargs:
    enable_thinking: true

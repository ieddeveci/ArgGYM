# Gemini through Google's OpenAI-compatible endpoint, which their docs still
# label beta and which "silently ignores" parameters it does not recognise.
# Read `request` in the generations before trusting that a sampling setting
# took effect.
name: gemini-aistudio
model: gemini-2.5-pro
base_url: https://generativelanguage.googleapis.com/v1beta/openai/
api_key_env: GEMINI_API_KEY
sampling:
  temperature: 0.0
  max_tokens: 32768

# Gemini 3.8 Flash through the Gemini API's OpenAI-compatible endpoint.
#
# Google exposes an OpenAI-compatible /chat/completions API, so this can use
# the same provider-agnostic harness as the other hosted models.
#
# Do not copy Qwen's top_p, top_k or min_p settings. Gemini 3.8's current
# migration guidance says to remove temperature/top_p/top_k generation
# overrides. Its reasoning system is tuned separately.
#
# Gemini 3.8 Flash thinks by default at "medium". We state that explicitly so
# the run manifest records the actual experimental condition instead of relying
# on a provider-side default.
#
# max_tokens is deliberately the model's full 65,536-token output allowance.
# Gemini counts internal thinking tokens against the output-token limit, so a
# smaller hard cap can terminate generation while the model is still reasoning.
name: gemini-aistudio
model: gemini-3.8-flash
base_url: ${oc.env:GEMINI_BASE_URL,https://generativelanguage.googleapis.com/v1beta/openai/}
api_key_env: GEMINI_API_KEY

sampling:
  max_tokens: 65536

extra_body:
  extra_body:
    google:
      thinking_config:
        thinking_level: medium
        include_thoughts: false
dtype: bfloat16
# Context: config.json's max_position_embeddings, 131,072.
max_model_len: 131072
gpu_memory_utilization: 0.9
reasoning_parser: deepseek_r1
trust_remote_code: false

# DeepSeek's official local vLLM example uses TP=2 and --enforce-eager.
extra_args:
- --enforce-eager

# 32B BF16 weights plus a 131,072-token context (34 GiB of KV) need two
# 80 GB H100s. A 141 GB H200 can serve this profile on one GPU.
tensor_parallel_size_h100: 2
tensor_parallel_size_h200: 1

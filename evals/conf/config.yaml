defaults:
  - taskset: pilot
  - model: qwen3.6-27b
  # How answers are elicited (reasoning method / system prompt) and how they are
  # submitted (the answer-delimiter template). The taskset carries only the task
  # and its answer spec; both of these are chosen here per run and recorded in
  # run.json, so neither is pinned into the frozen taskset.
  - elicitation: none
  - template: answer_tags
  - _self_

# Where artifacts land (relative to the repo root).
outputs_root: outputs
taskset_root: data/tasksets
runs_root: ${outputs_root}/runs
reports_root: ${outputs_root}/reports

# Inference endpoint served by evals/serve.sh on GPU 2.
endpoint:
  base_url: http://localhost:8900
  # Measured on qwen3.6-27b: p90 latency 1695s, p99 3375s, max 5413s. At the
  # original 1800s roughly 8% of requests timed out and were retried, so the
  # server regenerated them from scratch -- wasted GPU, not lost data (only 2
  # of 761 failed permanently). Sized above the observed maximum instead.
  timeout_s: 5400
  retries: 2

generation:
  max_tokens: 61440
  # Must comfortably exceed (data_parallel_size x per-replica capacity) or the
  # replicas sit idle waiting for work.
  concurrency: 96

serve:
  # Every model in the roster fits on a single 80GB card, so data parallelism
  # (a full replica per GPU, each serving different requests) gives near-linear
  # throughput -- unlike tensor parallelism, which would split one model across
  # cards and add communication overhead for no capacity gain.
  gpus: "0,1,2"
  data_parallel_size: 3

# Set by run_all.sh so every run in one sweep can be grouped.
sweep_id: null

# Build a taskset from a working tree with uncommitted changes. Off, because the
# recorded git_sha would then name a tree that does not regenerate the taskset --
# the benchmark's questions would have no identifiable source. Turning it on tags
# the directory name `dirty` so a throwaway build cannot be mistaken for canonical.
allow_dirty: false

# Directory name under taskset_root. Left null, the runner resolves it by
# globbing `<taskset.name>-*`, and refuses to guess if several match -- comparing
# models across different question sets would invalidate the whole sweep.
taskset_id: null

# Evaluate a slice of the canonical taskset rather than building a derived one.
# A derived taskset is redundant (it is a subset of the full one) and, for
# content-mode items, not even byte-reproducible across builds. Filtering the one
# frozen taskset keeps a single source of truth; the filter is recorded in
# run.json. null on a field means "no restriction".
#   e.g. eval_filter.levels=[1,3,5] to run only low difficulty.
eval_filter:
  levels: null
  tasks: null
  modes: null

hydra:
  run:
    dir: ${runs_root}/${now:%Y-%m-%d_%H-%M-%S}__${model.name}__${taskset.name}
  job:
    chdir: false

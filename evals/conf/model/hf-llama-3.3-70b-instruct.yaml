# meta-llama/Llama-3.3-70B-Instruct on vLLM, served by
# hpc/vllm/models/hf-llama-3.3-70b-instruct.yaml.
#
# Sampling: the card gives none, so this is generation_config.json: temperature
# 0.6, top_p 0.9. The meta-llama repo is gated to us; the file was read from
# the ungated copy https://huggingface.co/unsloth/Llama-3.3-70B-Instruct.
#
# Cap: the card recommends no output length, so the cap is the context rule. That
# is the serving profile's max_model_len minus the 8,192-token prompt reserve
# (hpc/vllm/verify_bundle.py checks the cap fits).
# Longest prompt in tasksets/standard.yaml with this tokenizer: 4,088
# tokens (tokenizer from unsloth/Llama-3.3-70B-Instruct; the original is gated).
name: hf-llama-3.3-70b-instruct
model: meta-llama/Llama-3.3-70B-Instruct
base_url: ${oc.env:VLLM_BASE_URL,http://127.0.0.1:8000/v1}
api_key_env: VLLM_API_KEY
sampling:
  max_tokens: 122880
  temperature: 0.6
  top_p: 0.9
  seed: 0

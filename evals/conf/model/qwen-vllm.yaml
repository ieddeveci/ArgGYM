# A local vLLM. No key: the server neither needs one nor rejects one.
#
# `chat_template_kwargs` is a vLLM extension and no hosted provider takes it --
# OpenAI and OpenRouter answer 400. It lives in extra_body precisely because
# that is the field for things one provider understands and the rest do not.
#
# Serving is not this harness's job. Stand the server up however you like; the
# harness only ever talks to an endpoint.
name: qwen-vllm
model: Qwen/Qwen3.6-27B
base_url: http://localhost:8000/v1
api_key_env: VLLM_API_KEY
sampling:
  temperature: 0.0
  max_tokens: 32768
extra_body:
  chat_template_kwargs:
    enable_thinking: true

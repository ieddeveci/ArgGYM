endpoint_config: hf-deepseek-r1-distill-qwen-32b
hf_model: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
params_b: 32
tier: large

dtype: bfloat16
tensor_parallel_size: 2
max_model_len: 65536
gpu_memory_utilization: 0.9
reasoning_parser: deepseek_r1
trust_remote_code: false

# DeepSeek's official local vLLM example uses TP=2 and --enforce-eager.
extra_args:
- --enforce-eager

# 32B BF16 weights plus ArgGYM's 65,536-token context need conservative
# headroom on 80 GB H100. A 141 GB H200 can serve this profile on one GPU.
tensor_parallel_size_h100: 2
tensor_parallel_size_h200: 1

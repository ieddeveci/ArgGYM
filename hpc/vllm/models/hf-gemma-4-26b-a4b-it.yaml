dtype: bfloat16
# Context: config.json and the card: 262,144 ("256K").
max_model_len: 262144
gpu_memory_utilization: 0.9
reasoning_parser: gemma4
trust_remote_code: false
# ArgGYM is text-only. --language-model-only sets every modality limit to 0,
# video included, so vLLM builds neither tower and reserves no encoder cache.
extra_args:
- --language-model-only
tensor_parallel_size_h100: 1
tensor_parallel_size_h200: 1

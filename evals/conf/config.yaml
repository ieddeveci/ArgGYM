# The run configuration. Composed by Hydra; every key here is overridable on the
# command line, and the whole resolved object is written into the run manifest.

defaults:
  - model: openrouter-gpt-5-medium
  - template: xml_tags
  - elicitation: cot
  - _self_

# A frozen taskset, by path. Named rather than globbed: the previous harness
# resolved tasksets by pattern, and silently taking the newest would let a
# taskset rebuilt mid-sweep score later models on different questions than
# earlier ones -- a comparison that looks valid and is not.
taskset: data/taskset-lite.jsonl

# A taskset frozen under another PROMPT_VERSION or SCORING_VERSION than the
# installed arggym's is refused: its questions do not state the rules the scorer
# enforces. True runs it anyway, for a deliberate rerun of an old file.
allow_stale_taskset: false

# Slice the frozen taskset in memory. Never a second freeze: two exports of the
# same grid are the same only if nothing moved in between.
filter:
  tasks: null
  levels: null
  orderings: null
  limit: null

endpoint:
  # A safety net for a hung connection. The token cap, not the clock, is what
  # ends a long generation: a completion that stops at `max_tokens` comes back
  # as a truncation the score can see, while one the clock stops comes back as
  # an API error, which drops the row from the score's denominator. A model that
  # loops slowly would then gain score from its own loops.
  #
  # So this is sized for the largest cap in evals/conf/model/, the 65,536
  # tokens every config shares where its context allows, at 10 tokens/s, a
  # deliberately slow single-request decode: 6,554 s. Three hours, 10,800 s,
  # leaves margin above that. Raise it with any cap, never lower it to fit one
  # server's speed.
  #
  # The client does not stream, so this bounds the whole request. metrics.json
  # reports the latency percentiles, how many requests came within 80% of this
  # number and how many expired outright; any expiry here is a hang or a
  # server slower than 10 tokens/s, and either is worth reading.
  timeout_s: 10800

  # Each retry regenerates the whole completion, so `retries` is also what
  # decides when a timeout becomes visible as an error: a row is only reported
  # as lost to the timeout when all three of its requests expire.
  # `n_requests_timed_out` in metrics.json counts the expired requests
  # themselves, which is the number that moves first and the number that says
  # what the wasted inference actually cost.
  retries: 2

  # A 429 with a Retry-After up to this many seconds is waited out and does not
  # spend `retries`, so a per-minute request limit slows a run instead of
  # failing rows. A longer wait, or a quota code such as Evren's
  # daily_token_limit_exceeded, stops the run with status stopped_on_quota;
  # rerunning the command after the reset resumes it. Ten minutes, above
  # Evren's 5-minute sliding token window, whose waits run to about 300 s.
  max_retry_after_s: 600

generation:
  # Threads, not processes: every worker is blocked on a socket. Match this to
  # whatever the endpoint will actually run in parallel -- a local vLLM's
  # --max-num-seqs, or a hosted provider's rate limit.
  concurrency: 16

# Above this share of API errors the run is marked failed rather than completed,
# so a report can tell a model that answered badly from an endpoint that was not
# there. The generations are kept either way and the run resumes.
max_error_rate: 0.2

# Skip ids already generated without an error. Off deletes the directory's
# generations and starts over, because the writer appends -- leaving them would
# be resuming under a flag that says otherwise.
resume: true

# What identifies a run, and therefore names its directory. Derived from the
# three things that change what a model was asked, so running the same command
# twice resumes instead of starting a second copy.
#
# It was a timestamp, which made every invocation a fresh directory and left
# `resume` unreachable: the feature was documented, tested at the function
# level, and impossible to trigger through the command line. Give `run_id` a
# value of your own for a deliberate second run of the same configuration.
run_id: ${model.name}__${template.name}__${elicitation.name}

hydra:
  run:
    dir: outputs/runs/${run_id}
  job:
    chdir: true

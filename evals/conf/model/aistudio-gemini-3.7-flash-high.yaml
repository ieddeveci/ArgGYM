# gemini-3.7-flash through the Gemini API's OpenAI-compatible endpoint.
#
# Limits: 1,048,576 input, 65,536 output, and thinking tokens count against the
# output limit (https://ai.google.dev/gemini-api/docs/models/gemini-3.7-flash,
# https://ai.google.dev/gemini-api/docs/thinking). The cap is the output limit.
#
# No temperature, top_p or top_k. Google's guidance for every Gemini 3.x model
# is to leave all three at their defaults
# (https://ai.google.dev/gemini-api/docs/whats-new-gemini-3.5).
#
# Thinking level: high. The Gemini API lists low, medium, high for
# gemini-3.7-flash, default medium
# (https://ai.google.dev/gemini-api/docs/thinking); "minimal is not supported and
# returns an error"
# (https://ai.google.dev/gemini-api/docs/models/gemini-3.7-flash).
# reasoning_effort maps onto the thinking level one-to-one in the OpenAI
# compatibility layer (https://ai.google.dev/gemini-api/docs/openai; the
# mapping table there covers earlier 3.x models, and is assumed here).
# One config per level: aistudio-gemini-3.7-flash-low,
# aistudio-gemini-3.7-flash-medium, aistudio-gemini-3.7-flash-high.
name: aistudio-gemini-3.7-flash-high
model: gemini-3.7-flash
base_url: ${oc.env:GEMINI_BASE_URL,https://generativelanguage.googleapis.com/v1beta/openai/}
api_key_env: GEMINI_API_KEY
sampling:
  max_tokens: 65536
  reasoning_effort: high

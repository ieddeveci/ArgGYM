# Claude Sonnet 4.5 through OpenRouter rather than through Anthropic's own
# OpenAI-compatible endpoint, and the reason is the reasoning trace.
# Anthropic's documentation says of that endpoint: "the OpenAI SDK doesn't
# return Claude's detailed thought process", and its
# `usage.completion_tokens_details` is always empty, so the thinking tokens
# are billed and invisible. OpenRouter returns them in `message.reasoning`,
# which `evals/client.py:reasoning_of` already reads.
#
# Limits: 200K context (1M in beta; OpenRouter's models API lists 1,000,000),
# 64K max output, and thinking tokens count against max_tokens
# (https://platform.claude.com/docs/en/models/sonnet-4-5/overview,
# https://platform.claude.com/docs/en/build-with-claude/context-windows).
# OpenRouter's models API lists max_completion_tokens 64000. The cap is that
# output limit, 64,000. Every config caps its output at 65,536 tokens at most,
# less where its context or provider limit is smaller, so token budgets match
# wherever the limits allow. 65,536 is the Gemini API's output limit, thinking
# included, so no larger cap can hold across the roster. This model's limit is
# smaller, so the cap is its limit.
#
# No temperature. With thinking on, Sonnet 4.5 accepts neither `temperature`
# nor `top_k` (https://platform.claude.com/docs/en/build-with-claude/thinking).
#
# Reasoning effort: low. OpenRouter accepts minimal, low, medium, high and
# xhigh (plus `max`, the same as xhigh, and `none`, which turns thinking off)
# and, for Anthropic models, turns the effort into a thinking budget:
# budget_tokens = max(min(max_tokens * ratio, 128000), 1024), with ratios
# 0.1 / 0.2 / 0.5 / 0.8 / 0.95 (https://openrouter.ai/docs/use-cases/reasoning-tokens).
# So the output budget is tied to the level: at this 64,000 cap the thinking
# budget is 12,800 tokens, and the answer gets what is left.
# One config per level: openrouter-claude-sonnet-4.5-minimal,
# openrouter-claude-sonnet-4.5-low, openrouter-claude-sonnet-4.5-medium,
# openrouter-claude-sonnet-4.5-high, openrouter-claude-sonnet-4.5-xhigh.
name: openrouter-claude-sonnet-4.5-low
model: anthropic/claude-sonnet-4.5
base_url: https://openrouter.ai/api/v1
api_key_env: OPENROUTER_API_KEY
sampling:
  max_tokens: 64000
extra_body:
  reasoning:
    effort: low

# Gemini 2.5 Pro through the Gemini API's OpenAI-compatible endpoint.
#
# Limits: 1,048,576 input, 65,536 output, and thinking tokens count against the
# output limit (https://ai.google.dev/gemini-api/docs/models/gemini-2.5-pro,
# https://ai.google.dev/gemini-api/docs/thinking). The cap is that limit,
# 65,536. Every config caps its output at 65,536 tokens at most, less where its
# context or provider limit is smaller, so token budgets match wherever the
# limits allow. 65,536 is the Gemini API's output limit, thinking included, so
# no larger cap can hold across the roster.
#
# Google publishes no sampling recommendation for 2.5 Pro, so none is set.
#
# Reasoning effort: low. Thinking cannot be turned off on this model, which
# takes low, medium and high (https://ai.google.dev/gemini-api/docs/thinking).
# The compatibility layer turns the effort into a thinking budget, 1,024 /
# 8,192 / 24,576 tokens for low / medium / high, so here that is 1,024
# (https://ai.google.dev/gemini-api/docs/openai).
# One config per level: aistudio-gemini-2.5-pro-low,
# aistudio-gemini-2.5-pro-medium, aistudio-gemini-2.5-pro-high.
name: aistudio-gemini-2.5-pro-low
model: gemini-2.5-pro
base_url: ${oc.env:GEMINI_BASE_URL,https://generativelanguage.googleapis.com/v1beta/openai/}
api_key_env: GEMINI_API_KEY
sampling:
  max_tokens: 65536
  reasoning_effort: low

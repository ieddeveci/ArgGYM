# Claude through OpenRouter rather than through Anthropic's own OpenAI-compatible
# endpoint, and the reason is the reasoning trace. Anthropic's documentation says
# of that endpoint: "the OpenAI SDK doesn't return Claude's detailed thought
# process", and its `usage.completion_tokens_details` is always empty, so the
# thinking tokens are billed and invisible. OpenRouter returns them in
# `message.reasoning`, which `evals/client.py:reasoning_of` already reads.
#
# Anthropic's shim also caps temperature at 1 and silently ignores `seed`,
# `response_format` and `reasoning_effort`. Going direct means going without all
# of that; if you do it anyway, read the recorded request body afterwards.
name: claude-openrouter
model: anthropic/claude-sonnet-4.5
base_url: https://openrouter.ai/api/v1
api_key_env: OPENROUTER_API_KEY
sampling:
  temperature: 0.0
  max_tokens: 32768
extra_body:
  reasoning:
    effort: high

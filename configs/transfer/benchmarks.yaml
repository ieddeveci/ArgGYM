      - task

reporting:
  compare:
    - PRE_RL_BASE_MODEL
    - POST_RL_SELECTED_CHECKPOINT

  report_absolute_scores: true
  report_delta:
    formula: POST_RL_MINUS_PRE_RL

  no_single_cross_benchmark_average: true

  finereason_components_reported_separately: true

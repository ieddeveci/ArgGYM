# Qwen/Qwen3.5-2B on vLLM, thinking off, served by
# hpc/vllm/models/hf-qwen3.5-2b.yaml. Its thinking-on sibling is hf-qwen3.5-2b.
#
# Sampling: the card's "Non-thinking mode for text tasks":
# temperature=1.0, top_p=1.0, top_k=20, min_p=0.0, presence_penalty=2.0,
# repetition_penalty=1.0 (https://huggingface.co/Qwen/Qwen3.5-2B/blob/main/README.md#L705).
#
# Thinking off: enable_thinking false. Thinking is a switch, not a
# level: the chat template reads enable_thinking and no reasoning_effort
# (https://huggingface.co/Qwen/Qwen3.5-2B/blob/main/chat_template.jinja).
# This size answers without thinking unless asked, so both configs send the
# switch explicitly (https://huggingface.co/Qwen/Qwen3.5-2B/blob/main/README.md#L585).
#
# Cap: 65,536. Every config caps its output at 65,536 tokens at most, less where
# its context or provider limit is smaller, so token budgets match wherever the
# limits allow. 65,536 is the Gemini API's output limit, thinking included, so
# no larger cap can hold across the roster. The card recommends 81,920: "For
# benchmarking on highly complex problems, such as those found in math and
# programming competitions, we suggest setting the max output length to 81,920
# tokens." (https://huggingface.co/Qwen/Qwen3.5-2B/blob/main/README.md#L979).
# The cap fits within the serving profile's max_model_len minus the 8,192-token
# prompt reserve (hpc/vllm/verify_bundle.py checks both).
# Longest prompt in data/taskset.jsonl with this tokenizer: 5,338
# tokens.
name: hf-qwen3.5-2b-nothink
model: Qwen/Qwen3.5-2B
base_url: ${oc.env:VLLM_BASE_URL,http://127.0.0.1:8000/v1}
api_key_env: VLLM_API_KEY
sampling:
  max_tokens: 65536
  temperature: 1.0
  top_p: 1.0
  presence_penalty: 2.0
  seed: 0
extra_body:
  top_k: 20
  min_p: 0.0
  repetition_penalty: 1.0
  chat_template_kwargs:
    enable_thinking: false

dtype: bfloat16
# Context: 262,144, from config.json (text_config.max_position_embeddings)
# and the card (https://huggingface.co/Qwen/Qwen3.5-122B-A10B/blob/main/README.md#L64).
max_model_len: 262144
gpu_memory_utilization: 0.9
# Parser and --language-model-only as the card serves it
# (https://huggingface.co/Qwen/Qwen3.5-122B-A10B/blob/main/README.md#L973).
reasoning_parser: qwen3
trust_remote_code: false
extra_args:
- --language-model-only
# Sizing: 125,086,497,008 parameters at BF16 are 250.2 GB of weights, vision tower
# included, which --language-model-only does not load. Full-attention KV is
# 12 layers x 2 KV heads x 256 dims x K,V x 2 B = 24,576 B per token.
# TP 4 stores each of the 2 KV heads 2 times, so 49,152 B.
# The other layers are linear attention, with a fixed state per request.
# The harness's 16 concurrent requests at the full 81,920 + 8,192
# tokens need 70.9 GB of KV.
# H100 x4: 4 x 80 GB x 0.9 - 250.2 = 37.8 GB of KV pool, room for 8 of the 16 at full length.
# H200 x4: 4 x 141 GB x 0.9 - 250.2 = 257.4 GB of KV pool.
tensor_parallel_size_h100: 4
tensor_parallel_size_h200: 4

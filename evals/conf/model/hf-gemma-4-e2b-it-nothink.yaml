# google/gemma-4-E2B-it on vLLM, thinking off, served by
# hpc/vllm/models/hf-gemma-4-e2b-it.yaml. Its thinking-on sibling is hf-gemma-4-e2b-it.
#
# Sampling: the card's "standardized sampling configuration across all use
# cases: temperature=1.0 top_p=0.95 top_k=64"
# (https://huggingface.co/google/gemma-4-E2B-it/blob/main/README.md#L364).
# One setting for both modes, so this config and its sibling differ only in
# enable_thinking. The card sets no presence penalty, so none is sent.
#
# Thinking off: enable_thinking false, the chat template's switch; the template
# reads no reasoning_effort, so there are no levels
# (https://huggingface.co/google/gemma-4-E2B-it/blob/main/chat_template.jinja).
# skip_special_tokens stays false so the gemma4 reasoning parser can see
# the channel markers that delimit the thought.
#
# Cap: the card recommends no output length (its examples use
# max_new_tokens=1024 and 512), and neither does Google's Gemma 4 model card
# (https://ai.google.dev/gemma/docs/core/model_card_4), so the cap is the context
# rule. That is the serving profile's max_model_len minus the 8,192-token prompt
# reserve (hpc/vllm/verify_bundle.py checks the cap fits).
# Longest prompt in data/taskset.jsonl with this tokenizer: 4,875
# tokens.
name: hf-gemma-4-e2b-it-nothink
model: google/gemma-4-E2B-it
base_url: ${oc.env:VLLM_BASE_URL,http://127.0.0.1:8000/v1}
api_key_env: VLLM_API_KEY
sampling:
  max_tokens: 122880
  temperature: 1.0
  top_p: 0.95
  seed: 0
extra_body:
  top_k: 64
  chat_template_kwargs:
    enable_thinking: false
  skip_special_tokens: false

# Qwen/Qwen3-32B on vLLM, served by hpc/vllm/models/hf-qwen3-32b.yaml.
#
# Sampling: the card's thinking-mode recommendation, "Temperature=0.6, TopP=0.95,
# TopK=20, and MinP=0"
# (https://huggingface.co/Qwen/Qwen3-32B).
#
# The card offers presence_penalty (0 to 2) only as a remedy for endless
# repetition, so none is set; #130 is where that gets measured.
#
# Cap: 32,768, the serving profile's max_model_len minus the 8,192-token prompt
# reserve. Every config caps its output at 65,536 tokens at most, less where its
# context or provider limit is smaller, so token budgets match wherever the
# limits allow. 65,536 is the Gemini API's output limit, thinking included, so
# no larger cap can hold across the roster. This profile's context is smaller,
# so the cap is what it leaves (hpc/vllm/verify_bundle.py checks both). The card
# recommends: "We recommend using an output length of 32,768 tokens for most
# queries. For benchmarking on highly complex problems, such as those found in
# math and programming competitions, we suggest setting the max output length to
# 38,912 tokens." (https://huggingface.co/Qwen/Qwen3-32B).
# Longest prompt in data/taskset.jsonl with this tokenizer: 4,066
# tokens.
name: hf-qwen3-32b
model: Qwen/Qwen3-32B
base_url: ${oc.env:VLLM_BASE_URL,http://127.0.0.1:8000/v1}
api_key_env: VLLM_API_KEY
sampling:
  max_tokens: 32768
  temperature: 0.6
  top_p: 0.95
  seed: 0
extra_body:
  top_k: 20
  min_p: 0.0
  chat_template_kwargs:
    enable_thinking: true

# mistralai/Ministral-3-3B-Reasoning-2512 on vLLM, served by
# hpc/vllm/models/hf-ministral-3-3b-reasoning-2512.yaml.
#
# Sampling: the card's "Use a temperature of 0.7 for most environments", with the
# top_p 0.95 its examples use
# (https://huggingface.co/mistralai/Ministral-3-3B-Reasoning-2512).
# generation_config.json sets no sampling keys.
#
# The card says to use its own system prompt, the [THINK] template in
# SYSTEM_PROMPT.txt, appended to any custom one; the harness sends only the
# elicitation's (a prompt-layer choice, not changed here).
#
# Cap: the card recommends no output length (its vLLM examples set
# MAX_TOK = 262144, the whole context), so the cap is the context rule. That is
# the serving profile's max_model_len minus the 8,192-token prompt reserve
# (hpc/vllm/verify_bundle.py checks the cap fits).
# Longest prompt in tasksets/standard.yaml with this tokenizer: 4,163
# tokens.
name: hf-ministral-3-3b-reasoning-2512
model: mistralai/Ministral-3-3B-Reasoning-2512
base_url: ${oc.env:VLLM_BASE_URL,http://127.0.0.1:8000/v1}
api_key_env: VLLM_API_KEY
sampling:
  max_tokens: 253952
  temperature: 0.7
  top_p: 0.95
  seed: 0

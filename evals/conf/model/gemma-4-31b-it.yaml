name: gemma-4-31b-it
hf_id: google/gemma-4-31B-it
model_path: google/gemma-4-31B-it
image: vllm/vllm-openai:latest
# 59G of weights on an 80GB card leaves the least KV headroom in the roster;
# raised from the 0.85 default to buy back cache space.
gpu_memory_utilization: 0.92
# Gemma-4's template only injects a thinking turn when enable_thinking is
# explicitly true, so without this the model would be evaluated with thinking
# OFF while every Qwen in the roster had it ON.
reasoning_parser: gemma4
enable_thinking: true
# Gemma-4 is multimodal: vLLM reserves a per-image token budget (2496) that
# exceeds the default max_num_batched_tokens (2048) and refuses to start. This
# benchmark is text-only, but the reservation is unconditional, so raise the
# batch budget above it.
extra_args: ["--max-num-batched-tokens", "8192"]
sampling:
  temperature: 1.0
  top_p: 0.95
  top_k: 64
sampling_source: own generation_config.json

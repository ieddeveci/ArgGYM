dtype: bfloat16

# Context: config.json's max_position_embeddings, 131,072.
max_model_len: 131072
gpu_memory_utilization: 0.9
reasoning_parser: deepseek_r1
trust_remote_code: false

# Retain DeepSeek's R1 local vLLM eager-mode recommendation.
extra_args:
- --enforce-eager

tensor_parallel_size_h100: 4
tensor_parallel_size_h200: 2

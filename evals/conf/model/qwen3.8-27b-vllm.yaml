# Qwen3.8-27B on a local vLLM. Needs vLLM 0.17.0+ and transformers 5.8.0+.
#
# Serving is not this harness's job -- stand the server up however you like and
# point base_url at it. What belongs here is what the request must carry.
#
# The sampling values are Qwen's own recommendation for thinking mode
# (huggingface.co/Qwen/Qwen3.8-27B): temperature 1.0, top_p 0.95, top_k 20,
# min_p 0.0. `top_k` and `min_p` are not OpenAI parameters, so they travel in
# extra_body, which is what that field is for.
#
# Do not add `reasoning_effort: high`. Qwen3.8's chat template accepts only
# xhigh, medium and low, and answers 500 on anything else (QwenLM/Qwen3.8#217).
name: qwen3.8-27b-vllm
model: Qwen/Qwen3.8-27B
base_url: ${oc.env:VLLM_BASE_URL,http://localhost:8927/v1}
api_key_env: VLLM_API_KEY
sampling:
  temperature: 1.0
  top_p: 0.95
  max_tokens: 24576
extra_body:
  top_k: 20
  min_p: 0.0
  # Thinking is on by default for this model; saying so makes the run manifest
  # record it rather than leaving a reader to know the default.
  chat_template_kwargs:
    enable_thinking: true

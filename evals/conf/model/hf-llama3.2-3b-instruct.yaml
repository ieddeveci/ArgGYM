# meta-llama/Llama-3.2-3B-Instruct on vLLM, served by
# hpc/vllm/models/hf-llama3.2-3b-instruct.yaml.
#
# Sampling: the card gives none, so this is generation_config.json: temperature
# 0.6, top_p 0.9. The meta-llama repo is gated to us; the file was read from
# the ungated copy https://huggingface.co/unsloth/Llama-3.2-3B-Instruct.
#
# Cap: the card recommends no output length, so the cap is the context rule.
# That is max_model_len 131,072 minus the 8,192-token prompt
# reserve (hpc/vllm/verify_bundle.py).
# Context: 128k on the card
# (https://huggingface.co/meta-llama/Llama-3.2-3B-Instruct), 131,072 in
# the mirrored config.json.
# Longest prompt in tasksets/standard.yaml with this tokenizer: 4,088
# tokens (tokenizer from unsloth/Llama-3.2-3B-Instruct; the original is gated).
name: hf-llama3.2-3b-instruct
model: meta-llama/Llama-3.2-3B-Instruct
base_url: ${oc.env:VLLM_BASE_URL,http://127.0.0.1:8000/v1}
api_key_env: VLLM_API_KEY
sampling:
  max_tokens: 122880
  temperature: 0.6
  top_p: 0.9
  seed: 0

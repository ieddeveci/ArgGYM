# Qwen/Qwen2.5-3B-Instruct on vLLM, served by
# hpc/vllm/models/hf-qwen2.5-3b-instruct.yaml.
#
# Sampling: the card gives none, so this is generation_config.json: temperature
# 0.7, top_p 0.8, top_k 20, repetition_penalty 1.05
# (https://huggingface.co/Qwen/Qwen2.5-3B-Instruct/blob/main/generation_config.json).
# The
# runner serves with --generation-config vllm, so these reach the model
# only by being sent.
#
# Cap: 24,576, the serving profile's max_model_len minus the 8,192-token prompt
# reserve. The roster shares one output cap, 65,536, so every model gets the
# same token budget (65,536 is the Gemini API's output limit, thinking included,
# so no larger cap can hold across the roster); this profile's context leaves
# less, so the cap is what it leaves (hpc/vllm/verify_bundle.py checks both).
# The card's "Context Length: Full 32,768 tokens and generation 8192 tokens"
# (https://huggingface.co/Qwen/Qwen2.5-3B-Instruct) describes what the model can
# generate, not advice for long reasoning, so it is no recommendation.
# Longest prompt in tasksets/standard.yaml with this tokenizer: 4,066
# tokens.
name: hf-qwen2.5-3b-instruct
model: Qwen/Qwen2.5-3B-Instruct
base_url: ${oc.env:VLLM_BASE_URL,http://127.0.0.1:8000/v1}
api_key_env: VLLM_API_KEY
sampling:
  max_tokens: 24576
  temperature: 0.7
  top_p: 0.8
  seed: 0
extra_body:
  top_k: 20
  repetition_penalty: 1.05

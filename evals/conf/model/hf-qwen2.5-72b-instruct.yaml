name: hf-qwen2.5-72b-instruct
model: Qwen/Qwen2.5-72B-Instruct
base_url: ${oc.env:VLLM_BASE_URL,http://127.0.0.1:8000/v1}
api_key_env: VLLM_API_KEY

# Official generation_config.json: temperature=.7, top_p=.8, top_k=20,
# repetition_penalty=1.05. Native config is 32,768 tokens; 28,672 output
# tokens preserve ArgGYM's 4,096-token prompt reserve without static YaRN.
sampling:
  max_tokens: 28672
  temperature: 0.7
  top_p: 0.8
  seed: 0
extra_body:
  top_k: 20
  repetition_penalty: 1.05

timeout_s: 5400
retries: 2

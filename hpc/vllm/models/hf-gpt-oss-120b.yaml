# The checkpoint ships MXFP4 expert weights, which vLLM detects from its
# config; bfloat16 is the dtype of everything else.
dtype: bfloat16

# Context: config.json's max_position_embeddings, 131,072.
max_model_len: 131072
gpu_memory_utilization: 0.9
reasoning_parser: openai_gptoss
trust_remote_code: false

extra_args:
- --no-enable-prefix-caching
- --max-num-batched-tokens
- '8192'

# A single 80 GB H100 is supported by OpenAI/vLLM, but two H100s are the
# conservative ArgGYM choice. One 141 GB H200 has ample headroom.
tensor_parallel_size_h100: 2
tensor_parallel_size_h200: 1

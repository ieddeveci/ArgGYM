# Qwen3.8-Flash-Next through Evren, an OpenAI-compatible endpoint with vLLM
# behind it, under the model id qwen3.8-flash-next. Evren returns the reasoning
# in `message.reasoning`.
#
# Sampling: the card's "Thinking Mode": temperature=1.0, top_p=0.95,
# top_k=20, min_p=0.0, presence_penalty=0.0, repetition_penalty=1.0
# (https://huggingface.co/Qwen/Qwen3.8-Flash-Next).
#
# reasoning_effort: low. The card sends it as the top-level `reasoning_effort`,
# "xhigh by default; supported levels are xhigh, medium, and low"
# (https://huggingface.co/Qwen/Qwen3.8-Flash-Next), and the chat template
# answers any other value with an error. One config per level:
# evren-qwen3.8-flash-next-low, evren-qwen3.8-flash-next-medium,
# evren-qwen3.8-flash-next-xhigh.
# The level reaches the model, but low and medium are not ordered. The
# template writes an instruction for xhigh and for low and none for medium, and
# the prompt grows to match: 1,878 / 1,866 / 1,836 tokens at xhigh / low /
# medium on status_query/L8/last_link_elitist/s0. Median reasoning over 5
# samples was, at low / medium / xhigh, 19,184 / 12,252 / every sample at the
# 32,768 probe cap on that item, and 11,697 / 6,750 / 43,112 on
# defeat_diagnosis/L8/last_link_elitist/s0 (probed 2026-09-24). Medium, the
# level with no instruction, reasons least.
#
# Limits: Evren serves qwen3.8-flash-next with max_model_len 262,144, from the
# 400 it returns for an oversized max_tokens ("cannot be greater than
# max_model_len=max_total_tokens=262144", probed 2026-09-24); its /v1/models
# lists no limits. The cap is 65,536, below that limit. Every config caps its
# output at 65,536 tokens at most, less where its context or provider limit is
# smaller, so token budgets match wherever the limits allow. 65,536 is the
# Gemini API's output limit, thinking included, so no larger cap can hold
# across the roster. The card recommends: "Reasoning Content: Set the maximum
# output length to 262,144 tokens. Final Response: Set the maximum output
# length to 131,072 tokens."
name: evren-qwen3.8-flash-next-low
model: qwen3.8-flash-next
base_url: https://evren-llmapi.ssyz.org.tr/v1
api_key_env: EVREN_API_KEY
sampling:
  max_tokens: 65536
  temperature: 1.0
  top_p: 0.95
  presence_penalty: 0.0
  reasoning_effort: low
extra_body:
  top_k: 20
  min_p: 0.0
  repetition_penalty: 1.0

          - graphcoloring_state_transition
          - game24_state_transition
          - gridpuzzle_state_transition
        scorer: state_transition_accuracy

    exclude_end_to_end_from_primary_transfer: true

    decoding:
      policy: qwen3_thinking_sampling_v1
      do_sample: true
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      seed: 1234
      max_output_tokens: 32768

    primary_metrics:

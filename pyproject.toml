[project]
name = "arggym"
version = "2.0.0"
description = "A generator and grader for defeasible-argumentation tasks in ASPIC+"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "python-argumentation==2.0.2",
    "flask>=3.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
arggym = "arggym.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "arggym"

[tool.pytest.ini_options]
testpaths = ["tests"]

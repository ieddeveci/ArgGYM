# OpenRouter. The default provider, and the one that costs least to be right
# about: it speaks the OpenAI protocol fully, returns reasoning in `reasoning`,
# and proxies Anthropic and Google, so one binding reaches most of the roster.
#
# Limits: OpenRouter's models API lists context 400000, max_completion_tokens
# 128000 and max_prompt_tokens 272000 for openai/gpt-5
# (https://openrouter.ai/api/v1/models). The cap is the output limit.
#
# No temperature: OpenRouter does not list `temperature` or `top_p` among the
# parameters this model supports, and OpenAI's guidance is to omit them for its
# reasoning models (https://developers.openai.com/api/docs/guides/latest-model).
name: gpt-5-openrouter
model: openai/gpt-5
base_url: https://openrouter.ai/api/v1
api_key_env: OPENROUTER_API_KEY
sampling:
  max_tokens: 128000

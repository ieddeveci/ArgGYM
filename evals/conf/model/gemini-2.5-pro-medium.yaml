# Gemini 2.5 Pro through the Gemini API's OpenAI-compatible endpoint.
#
# Limits: 1,048,576 input, 65,536 output, and thinking tokens count against the
# output limit (https://ai.google.dev/gemini-api/docs/models/gemini-2.5-pro,
# https://ai.google.dev/gemini-api/docs/thinking). The cap is the output limit.
#
# Google publishes no sampling recommendation for 2.5 Pro, so none is set.
#
# Reasoning effort: medium. Thinking cannot be turned off on this model, which
# takes low, medium and high (https://ai.google.dev/gemini-api/docs/thinking).
# The compatibility layer turns the effort into a thinking budget, 1,024 /
# 8,192 / 24,576 tokens for low / medium / high, so here that is 8,192
# (https://ai.google.dev/gemini-api/docs/openai).
# One config per level: gemini-2.5-pro-low, gemini-2.5-pro-medium, gemini-2.5-pro-high.
name: gemini-2.5-pro-medium
model: gemini-2.5-pro
base_url: ${oc.env:GEMINI_BASE_URL,https://generativelanguage.googleapis.com/v1beta/openai/}
api_key_env: GEMINI_API_KEY
sampling:
  max_tokens: 65536
  reasoning_effort: medium

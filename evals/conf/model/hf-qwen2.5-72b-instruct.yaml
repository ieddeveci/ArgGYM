# Qwen/Qwen2.5-72B-Instruct on vLLM, served by hpc/vllm/models/hf-qwen2.5-72b-instruct.yaml.
#
# Sampling: the card gives none, so this is generation_config.json: temperature
# 0.7, top_p 0.8, top_k 20, repetition_penalty 1.05
# (https://huggingface.co/Qwen/Qwen2.5-72B-Instruct/blob/main/generation_config.json). The
# runner serves with --generation-config vllm, so these reach the model
# only by being sent.
#
# The card says the model generates up to 8,192 tokens ("generation 8192
# tokens"); the cap follows the context rule and sits above that.
#
# Cap: max_model_len 32,768 minus the 8,192-token prompt reserve
# (hpc/vllm/verify_bundle.py).
# Context: config.json's max_position_embeddings, 32,768. The card's 131,072
# needs static YaRN, which it advises only for long inputs.
# Longest prompt in tasksets/standard.yaml with this tokenizer: 4,066
# tokens.
name: hf-qwen2.5-72b-instruct
model: Qwen/Qwen2.5-72B-Instruct
base_url: ${oc.env:VLLM_BASE_URL,http://127.0.0.1:8000/v1}
api_key_env: VLLM_API_KEY
sampling:
  max_tokens: 24576
  temperature: 0.7
  top_p: 0.8
  seed: 0
extra_body:
  top_k: 20
  repetition_penalty: 1.05

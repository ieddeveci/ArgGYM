# openai/gpt-oss-20b on vLLM, served by hpc/vllm/models/hf-gpt-oss-20b.yaml.
#
# Sampling: "We recommend sampling with temperature=1.0 and top_p=1.0"
# (https://github.com/openai/gpt-oss; the HF card gives none,
# https://huggingface.co/openai/gpt-oss-20b). reasoning_effort goes to the chat template,
# which renders it as "Reasoning: medium"; medium is also its default.
#
# Cap: max_model_len 131,072 minus the 8,192-token prompt reserve
# (hpc/vllm/verify_bundle.py).
# Context: config.json's max_position_embeddings, 131,072.
# Longest prompt in tasksets/standard.yaml with this tokenizer: 3,917
# tokens.
name: hf-gpt-oss-20b
model: openai/gpt-oss-20b
base_url: ${oc.env:VLLM_BASE_URL,http://127.0.0.1:8000/v1}
api_key_env: VLLM_API_KEY
sampling:
  max_tokens: 122880
  temperature: 1.0
  top_p: 1.0
  seed: 0
  reasoning_effort: medium
extra_body:
  include_reasoning: true

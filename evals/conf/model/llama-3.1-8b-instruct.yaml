name: llama-3.1-8b-instruct
# Served from the ungated NousResearch re-upload of the identical
# meta-llama/Llama-3.1-8B-Instruct weights (LlamaForCausalLM, hidden 4096, 32
# layers, vocab 128256). The official meta-llama repo is gated and requires a
# valid HF token with granted access; the mirror needs no auth, so the local
# roster serves without credentials. Same weights, same generation_config.
hf_id: meta-llama/Llama-3.1-8B-Instruct
model_path: NousResearch/Meta-Llama-3.1-8B-Instruct
image: vllm/vllm-openai:latest
reasoning_parser: null
enable_thinking: null
# 0.85 left only ~16GB for KV after 52GB of weights, capping concurrency at
# 12-14 of 32 in-flight requests with the cache pegged at 98%. vLLM also warns
# CUDA-graph profiling makes 0.85 effectively 0.8373.
gpu_memory_utilization: 0.93
extra_args: []
sampling:
  temperature: 0.6
  top_p: 0.9
  top_k: null
sampling_source: own generation_config.json

# Qwen/Qwen3-4B on vLLM, thinking off. Its thinking-on sibling is hf-qwen3-4b,
# served by the same profile.
#
# Sampling: the card's non-thinking recommendation, "Temperature=0.7, TopP=0.8,
# TopK=20, and MinP=0" (https://huggingface.co/Qwen/Qwen3-4B). As in the
# thinking-on config, the card's presence_penalty tip is conditional on endless
# repetitions, so none is set.
#
# Cap: 32,768, the same as hf-qwen3-4b: the serving context of 40,960 minus the
# 8,192-token prompt reserve.
name: hf-qwen3-4b-nothink
model: Qwen/Qwen3-4B
base_url: ${oc.env:VLLM_BASE_URL,http://127.0.0.1:8000/v1}
api_key_env: VLLM_API_KEY
sampling:
  max_tokens: 32768
  temperature: 0.7
  top_p: 0.8
  seed: 0
extra_body:
  top_k: 20
  min_p: 0.0
  chat_template_kwargs:
    enable_thinking: false

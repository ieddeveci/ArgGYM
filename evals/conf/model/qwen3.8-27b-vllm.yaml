# Qwen/Qwen3.8-27B on a local vLLM.
#
# A local-server twin of hf-qwen3.8-27b, which is the config the HPC sweep runs
# (hpc/vllm/submit_truba.sh). Every setting is held equal to that one, so
# the two differ only in name and base_url; serve with the profile's
# --max-model-len or the cap below will not fit. They land in separate run
# directories because run_id is built from model.name.
#
# Sampling: the card's "Thinking Mode": temperature=1.0, top_p=0.95,
# top_k=20, min_p=0.0, presence_penalty=0.0, repetition_penalty=1.0
# (https://huggingface.co/Qwen/Qwen3.8-27B).
#
# reasoning_effort: the card offers xhigh (the default), medium and low, and
# the chat template answers any other value with an error. medium is kept
# from before; it is not the model's default.
#
# Cap: max_model_len 131,072 minus the 8,192-token prompt reserve
# (hpc/vllm/verify_bundle.py).
# Context: 262,144 native (config.json, card), served at 131,072 because
# one H100 cannot hold more alongside the weights; the serving profile
# has the arithmetic.
# Longest prompt in tasksets/standard.yaml with this tokenizer: 4,428
# tokens.
name: qwen3.8-27b-vllm
model: Qwen/Qwen3.8-27B
base_url: ${oc.env:VLLM_BASE_URL,http://localhost:8927/v1}
api_key_env: VLLM_API_KEY
sampling:
  max_tokens: 122880
  temperature: 1.0
  top_p: 0.95
  presence_penalty: 0.0
  seed: 0
  reasoning_effort: medium
extra_body:
  top_k: 20
  min_p: 0.0
  repetition_penalty: 1.0
  chat_template_kwargs:
    enable_thinking: true
    preserve_thinking: true

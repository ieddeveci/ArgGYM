dtype: bfloat16

# Context: 128k on the card
# (https://huggingface.co/meta-llama/Llama-3.3-70B-Instruct), 131,072 in
# the mirrored config.json.
max_model_len: 131072
gpu_memory_utilization: 0.9
trust_remote_code: false
extra_args: []

# Conservative headroom for ~141 GB BF16 weights plus KV/runtime state.
tensor_parallel_size_h100: 4
tensor_parallel_size_h200: 2
